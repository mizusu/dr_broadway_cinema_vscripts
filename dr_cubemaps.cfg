// Builds the map's cubemaps and reloads it. compile.ps1 copies this into tf\cfg.
// Every compile wipes the cubemaps, so after loading a new build type:  exec dr_cubemaps
// buildcubemaps finishes before the next line runs, so the order below is safe.
sv_cheats 1
mat_specular 0
buildcubemaps
mat_specular 1
map dr_skullgirls_cinema
