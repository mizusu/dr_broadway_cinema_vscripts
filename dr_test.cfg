// Local test setup. compile.ps1 installs this as tf\cfg\dr_skullgirls_cinema.cfg,
// which TF2 runs automatically every time the map loads on your own game.
// It is not packed into the map, so real servers never see it.
sv_cheats 1
mp_waitingforplayers_time 0
mp_teams_unbalance_limit 0
tf_arena_use_queue 0
// One RED bot per test trap (traps.nut puts each in its own square and respawns it
// there), plus a spare that stays at spawn so arena doesn't end the round when the
// trapped bots are all dead.
bot -team red
bot -team red
bot -team red
bot -team red
// Fire a trap from anywhere (as BLU): trap1, trap2, trap3, or say !t1, !t2, !t3 in chat.
// traps.nut reads the chat line, so it works like hitting the button. (ent_fire from the
// console didn't reach the map in testing.) Bind them to keys if you like,
// e.g.  bind kp_end trap1
alias trap1 "say !t1"
alias trap2 "say !t2"
alias trap3 "say !t3"
