// Trap testing on your own game. compile.ps1 copies this into tf\cfg.
// In the TF2 console, once the map is loaded:
//
//   exec dr_trap_test   defines the commands below
//   trap_teams          you go BLU, every bot goes RED, and the round restarts
//   trap_place          puts each RED bot in its trap's square, you at the buttons on the
//                       balcony, and re-arms every trap
//   trap_rearm          makes every trap ready again
//   trap_back           you back to RED, the bots to BLU, and the round restarts
//
// Then hit or shoot the green button. The console prints the zone and where each RED
// was ([traps] lines). On your own game the bots are also placed automatically at round
// start and whenever their trap re-arms, so usually none of this is needed.

alias trap_teams "ent_fire trap_logic CallScriptFunction TrapTestTeams; mp_restartgame 2"
alias trap_place "ent_fire trap_logic CallScriptFunction TrapTestPlace"
alias trap_rearm "ent_fire trap_logic CallScriptFunction TrapTestRearm"
alias trap_back "jointeam red; bot_changeteams; mp_restartgame 1"
echo "Trap test ready: trap_teams, then trap_place once you respawn, then hit the button."
